<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Node CTF – Login</title>
</head>
<body>
  <h1>Node.js CTF – Login</h1>
  <p>
    This is a small web application for your security challenge.
  </p>
  <p>
    Known test account (for students): <code>student / student123</code>
  </p>
  <form method="POST" action="/login">
    <label>
      Username:
      <input type="text" name="username" required />
    </label>
    <br/><br/>
    <label>
      Password:
      <input type="password" name="password" required />
    </label>
    <br/><br/>
    <button type="submit">Log in</button>
  </form>

  <p>
    Once logged in, explore the site and see what information is stored in your browser…
  </p>
</body>
</html>
