<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CTF-1 – Login</title>

    <!-- Bootstrap CSS (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-PLACEHOLDER" crossorigin="anonymous">

    <!-- Custom styles -->
    <link rel="stylesheet" href="/css/custom.css" />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #024a49;">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="#">
          <span class="logo-box me-2"></span>
          <span class="brand-text">CTF-1</span>
        </a>
      </div>
    </nav>

    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
          <div class="card shadow-sm">
            <div class="card-body">
              <h3 class="card-title mb-3">Sign in</h3>
              <p class="text-muted">This is a small web application for your security challenge.</p>

              <form method="POST" action="/login">
                <div class="mb-3">
                  <label class="form-label">Username</label>
                  <input class="form-control" type="text" name="username" required />
                </div>
                <div class="mb-3">
                  <label class="form-label">Password</label>
                  <input class="form-control" type="password" name="password" required />
                </div>
                <div class="d-grid">
                  <button class="btn btn-primary" type="submit">Log in</button>
                </div>
              </form>

              <hr />
              <p class="small text-muted mb-0">Known test account (for students): <code>student / student123</code></p>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Bootstrap JS (optional) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-PLACEHOLDER" crossorigin="anonymous"></script>
  </body>
</html>
