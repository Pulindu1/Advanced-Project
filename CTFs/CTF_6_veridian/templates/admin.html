<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veridian Secure -- Admin Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Courier New', monospace;
            background: #0a0a0a;
            color: #c0c0c0;
            min-height: 100vh;
        }
        .nav {
            background: #2a0a0a;
            border-bottom: 1px solid #553333;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .nav-brand {
            color: #cc4444;
            font-size: 1em;
            letter-spacing: 3px;
        }
        .nav-label {
            color: #cc4444;
            font-size: 0.8em;
            letter-spacing: 2px;
        }
        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .classified-banner {
            background: #2a0a0a;
            border: 2px solid #cc4444;
            padding: 15px;
            text-align: center;
            margin-bottom: 25px;
        }
        .classified-banner h2 {
            color: #cc4444;
            font-size: 1.1em;
            letter-spacing: 4px;
        }
        .case-file {
            background: #111;
            border: 1px solid #333;
            padding: 25px;
        }
        .case-file-body {
            white-space: pre-line;
            line-height: 1.7;
            font-size: 0.9em;
            color: #bbb;
        }
        .evidence-token {
            margin-top: 20px;
            padding: 15px;
            background: #1a1a0a;
            border: 1px solid #999944;
            color: #cccc44;
            font-size: 0.9em;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="nav">
        <span class="nav-brand">VERIDIAN SECURE</span>
        <span class="nav-label">ADMIN -- CLASSIFIED ACCESS</span>
    </div>
    <div class="container">
        <div class="classified-banner">
            <h2>CLASSIFIED</h2>
        </div>
        <div class="case-file">
            <div class="case-file-body">{{ case_file }}</div>
            <div class="evidence-token">Evidence token: {{ flag4 }}</div>
        </div>
    </div>
</body>
</html>
