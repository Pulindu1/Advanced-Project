<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veridian Secure -- Login</title>
    <!-- Veridian Secure Portal v3.2.1 | Deployment: cloud-internal -->
    <!-- service status: /health -->
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Courier New', monospace;
            background: #0a0a0a;
            color: #c0c0c0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            background: #111;
            border: 1px solid #333;
            padding: 40px;
            max-width: 520px;
            width: 100%;
        }
        .logo {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 1px solid #333;
            padding-bottom: 20px;
        }
        .logo h1 {
            color: #4a9e4a;
            font-size: 1.4em;
            letter-spacing: 4px;
        }
        .flavour-text {
            font-size: 0.8em;
            color: #777;
            margin-bottom: 25px;
            line-height: 1.6;
            white-space: pre-line;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            color: #4a9e4a;
            font-size: 0.8em;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #c0c0c0;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
        }
        input:focus {
            outline: none;
            border-color: #4a9e4a;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #1a3a1a;
            border: 1px solid #4a9e4a;
            color: #4a9e4a;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            cursor: pointer;
            letter-spacing: 2px;
            margin-top: 10px;
        }
        button:hover {
            background: #2a4a2a;
        }
        .error {
            color: #cc4444;
            font-size: 0.85em;
            margin-bottom: 15px;
            text-align: center;
        }
        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.7em;
            color: #444;
        }
        .footer a {
            color: #555;
            text-decoration: none;
        }
        .footer a:hover {
            color: #4a9e4a;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>VERIDIAN SECURE</h1>
        </div>
        <div class="flavour-text">{{ flavour_text }}</div>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="POST" action="/login">
            <div class="form-group">
                <label>USERNAME</label>
                <input type="text" name="username" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label>PASSWORD</label>
                <input type="password" name="password" autocomplete="current-password" required>
            </div>
            <button type="submit">AUTHENTICATE</button>
        </form>
        <div class="footer">
            <a href="/static/CHANGELOG.md">v3.2.1</a> | Veridian Secure Ltd.
        </div>
    </div>
</body>
</html>
