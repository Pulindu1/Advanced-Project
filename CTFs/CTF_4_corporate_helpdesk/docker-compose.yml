version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: intradesk-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-intradesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-intradesk_password}
      POSTGRES_DB: ${POSTGRES_DB:-intradesk_kb}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - intradesk-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intradesk"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: intradesk-redis
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    networks:
      - intradesk-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: intradesk-api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://intradesk:intradesk_password@db:5432/intradesk_kb}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${API_PORT:-4001}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key}
      SESSION_SECRET: ${SESSION_SECRET:-your-super-secret-session-key}
    ports:
      - "4001:4001"
    volumes:
      - ./apps/api:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - intradesk-network
    command: npm run dev

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: intradesk-web
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:4001}
    ports:
      - "5174:5173"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    depends_on:
      - api
    networks:
      - intradesk-network
    command: npm run dev -- --host

  bot:
    build:
      context: ./apps/bot
      dockerfile: Dockerfile
    container_name: intradesk-bot
    environment:
      BOT_BASE_URL: ${BOT_BASE_URL:-http://web:5173}
      BOT_API_URL: ${BOT_API_URL:-http://api:4001}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@intradesk.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin_secure_password_123}
    depends_on:
      - api
      - redis
    networks:
      - intradesk-network
    command: npm run dev

networks:
  intradesk-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
