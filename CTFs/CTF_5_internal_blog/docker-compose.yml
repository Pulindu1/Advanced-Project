services:
  app:
    build: .
    container_name: novacms
    ports:
      - "5175:5000"
    environment:
      - FLASK_APP=app
      - SECRET_KEY=novacms-dev-2024
      - DATABASE_URL=sqlite:////app/instance/novacms.db
    volumes:
      - ./flags.json:/app/flags.json:ro
      - ./credentials.json:/app/credentials.json:ro
      - novacms-data:/app/instance
    restart: unless-stopped

volumes:
  novacms-data:
