<!DOCTYPE html>
<html>
<head>
    <title>Test Login</title>
    <style>
        body { font-family: Arial; max-width: 600px; margin: 50px auto; padding: 20px; }
        input, button { display: block; margin: 10px 0; padding: 10px; width: 100%; }
        #result { margin-top: 20px; padding: 10px; border: 1px solid #ccc; background: #f5f5f5; white-space: pre-wrap; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h1>CTF3 HR System - Login Test</h1>
    <div>
        <label>Username:</label>
        <input type="text" id="username" value="abcd12">
        
        <label>Password:</label>
        <input type="password" id="password" value="password">
        
        <button onclick="testLogin()">Test Login</button>
        
        <div id="result"></div>
    </div>

    <script>
        async function testLogin() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const resultDiv = document.getElementById('result');
            
            resultDiv.innerHTML = 'Testing login...';
            
            try {
                console.log('Sending request to:', 'http://127.0.0.1:8003/api/auth/login');
                console.log('Credentials:', { username, password });
                
                const response = await fetch('http://127.0.0.1:8003/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password })
                });
                
                console.log('Response status:', response.status);
                console.log('Response headers:', [...response.headers.entries()]);
                
                const data = await response.json();
                console.log('Response data:', data);
                
                if (response.ok) {
                    resultDiv.className = 'success';
                    resultDiv.innerHTML = 'SUCCESS!\n\n' + JSON.stringify(data, null, 2);
                } else {
                    resultDiv.className = 'error';
                    resultDiv.innerHTML = 'ERROR ' + response.status + '\n\n' + JSON.stringify(data, null, 2);
                    
                    // Also log to console
                    console.error('Full error details:', {
                        status: response.status,
                        statusText: response.statusText,
                        data: data,
                        headers: [...response.headers.entries()]
                    });
                }
            } catch (error) {
                console.error('Error:', error);
                resultDiv.className = 'error';
                resultDiv.innerHTML = 'FETCH ERROR:\n' + error.message + '\n\nCheck console for details';
            }
        }
    </script>
</body>
</html>
