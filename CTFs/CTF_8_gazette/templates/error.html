{{ template "header" . }}
<section class="error-shell">
  <div class="error-card">
    <h1 class="error-title">{{ if .Title }}{{ .Title }}{{ else }}PressRoom: Something went wrong{{ end }}</h1>
    <p class="error-message">
      {{ if .Message }}{{ .Message }}{{ else }}PressRoom hit an unexpected problem. Please try again or return to your dashboard.{{ end }}
    </p>
    <a class="back-link" href="/dashboard">Back to dashboard</a>
  </div>
</section>
{{ template "footer" . }}
