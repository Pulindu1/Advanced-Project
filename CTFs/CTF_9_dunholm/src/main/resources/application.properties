spring.application.name=trialvault
server.port=8080
server.error.whitelabel.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never

# PressRoom-style handoff flag kept in a comment for the auditor.
# FLAG2_PLACEHOLDER will be substituted at build time by the flag-generation pipeline.
# DR-HANDOFF-FLAG2: {{PLAYER_FLAG2}}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/trialvault}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:trialvault}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:trialvault}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=classpath:db/seed-data.sql

spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}

spring.thymeleaf.cache=false

# Actuator -- everything exposed for the handoff audit
management.endpoints.web.exposure.include=*
management.endpoint.env.show-values=always
management.endpoint.configprops.show-values=always
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.info.env.enabled=true
management.info.java.enabled=true
management.info.build.enabled=true

# Log configuration, exposed via /actuator/logfile
logging.file.name=/app/logs/trialvault.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n
logging.level.root=INFO
logging.level.com.dunholm=INFO
logging.level.com.dunholm.service.AuthService=DEBUG

# JWT configuration
jwt.public-key-location=classpath:keys/public.pem
jwt.private-key-location=classpath:keys/private.pem
jwt.private-key-pem=${JWT_PRIVATE_KEY_PEM:}
jwt.issuer=trialvault
jwt.cookie-name=tv_session
jwt.expiry-minutes=60
# NOTE from Marcus on handover (see dev runbook):
# trust-algorithm-header allows the token's own header to choose the verification algorithm.
# This was added for the cross-realm integration pilot; can be turned off once that ships.
jwt.verification.trust-algorithm-header=true

# Document encryption (RSA-512 fixed pair + AES-256-GCM wrapping)
doc.public-key-location=classpath:keys/doc-public.pem
doc.private-key-pem=${DOC_PRIVATE_KEY_PEM:}

# File download roots
file.storage.base-path=/data/uploads
file.vault-path=/data/vault

# Dunholm internal handover credentials (phase 1 of a rotating credential pair)
# This property name intentionally avoids the default sanitiser regex so the
# Actuator env endpoint surfaces it without masking.
app.config.dunholm-handoff-a=${DR_API_KEY_PART1:dr-part1-3d7fa8c2b6e04915}

# Rate limiting
app.ratelimit.login.capacity=5
app.ratelimit.login.refill-seconds=120

# Seed data locations (mounted read-only from data/)
app.seed.flags-path=/app/seed/flags.json
app.seed.users-path=/app/seed/users.json
app.config.properties-location=/app/config/application.properties
app.vault.shared-part2=dr-part2-7f1a9c5e3b8d4a6f
