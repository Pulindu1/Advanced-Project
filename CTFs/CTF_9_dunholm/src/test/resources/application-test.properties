# Integration-test profile.
# Uses H2 in PostgreSQL mode so the production schema.sql (BIGSERIAL,
# ILIKE) keeps applying without modification. Redis is excluded
# entirely -- nothing in the application code path actually requires
# it; Bucket4j's rate limiter holds buckets in-process.

spring.datasource.url=jdbc:h2:mem:trialvault-it;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=

spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# Production paths point at /app/seed and /app/logs which do not exist
# in the unit test sandbox. Pointing them at the temp dir keeps the
# CommandLineRunner tolerant. The seed JSON is absent so it just logs
# a warning and exits.
app.seed.flags-path=${java.io.tmpdir}/dunholm-it-flags-absent.json
app.seed.users-path=${java.io.tmpdir}/dunholm-it-users-absent.json
app.config.properties-location=${java.io.tmpdir}/dunholm-it-app-properties-absent.properties
file.storage.base-path=${java.io.tmpdir}/dunholm-it-uploads
file.vault-path=${java.io.tmpdir}/dunholm-it-vault
logging.file.name=${java.io.tmpdir}/dunholm-it.log

jwt.public-key-location=classpath:keys/public.pem
jwt.private-key-location=classpath:keys/private.pem
jwt.issuer=trialvault-it
jwt.cookie-name=tv_session
jwt.expiry-minutes=60
jwt.verification.trust-algorithm-header=false

doc.public-key-location=classpath:keys/doc-public.pem

app.ratelimit.login.capacity=50
app.ratelimit.login.refill-seconds=1
